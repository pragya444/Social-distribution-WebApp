      responses:
        '200':
          description: HTML form
    post:
      tags:
        - Entries
      summary: Submit new entry via multipart form
      description: |
        Create a text or image entry via web form. For images, set `as_image=on` and include `image` file field. Server converts images to base64 for storage.
      parameters:
        - name: author_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: "Sunset"
                content:
                  type: string
                  example: "Nice view"
                contentType:
                  type: string
                  example: "text/markdown"
                visibility:
                  type: string
                  example: "PUBLIC"
                as_image:
                  type: string
                  example: "on"
                image:
                  type: string
                  format: binary
      security:
        - cookieAuth: []
      responses:
        '302':
          description: Redirect to author's stream on success
        '400':
          description: Validation error

