    post:
      tags:
        - Entries
      summary: Submit new entry via multipart form
      description: |
        Create a text or image entry via web form. For images, set `as_image=on` and include `image` file field. Server converts images to base64 for storage.
      parameters:
        - name: author_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
