{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="icon" type="image/png" href="{% static 'images/android-chrome-512x512.png' %}" />
    <link rel="stylesheet" href="{% static 'css/auth.css' %}" />
  </head>

  <style>
    .err{
      background:#fee2e2; color:#b91c1c; border:1px solid #fecaca;
      padding:10px 12px; border-radius:10px; margin-bottom:14px;
    }
  </style>


  <body>
    <article class="card">
      <h1>Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your Social Distribution account</p>

      <form method="POST">
        {% csrf_token %} 
        {% if errors.error %}
          <div class="err">{{ errors.error.0 }}</div>
        {% endif %}
        {% if errors.non_field_errors %}
          <div class="err">
            {{ errors.non_field_errors|join:", " }}
          </div>
        {% endif %}

        <div class="input-div">
          <label for="username">Username</label>
          <input
            type="text"
            name="username"
            id="username"
            placeholder="Username"
            required
          />
        </div>

        <div class="input-div">
          <label for="password">Password</label>
          <input
            type="password"
            name="password"
            id="password"
            placeholder="Password"
            required
            minlength="8"
          />
        </div>

        <button class="auth-btn" type="submit">Log In</button>
      </form>
      <p class="auth-footer">
        Not registered yet? <a href="{% url 'register' %}">Create an account</a>
      </p>
    </article>
  </body>
</html>
