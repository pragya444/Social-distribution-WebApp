{% extends "base.html" %}
{% block title %}Edit Entry{% endblock %}
{% block content %}
<div class="page-form">
  <h1>Edit Entry</h1>

  <form method="post" class="form" enctype="multipart/form-data">
    {% csrf_token %}

    <label class="form-row">
      <span>Title</span>
      <input name="title" value="{{ entry.title }}" required>
    </label>

    <label class="form-row">
      <span>Visibility</span>
      <select name="visibility">
        <option value="PUBLIC"   {% if entry.visibility == "PUBLIC" %}selected{% endif %}>Public</option>
        <option value="UNLISTED" {% if entry.visibility == "UNLISTED" %}selected{% endif %}>Unlisted</option>
        <option value="FRIENDS"  {% if entry.visibility == "FRIENDS" %}selected{% endif %}>Friends</option>
      </select>
    </label>

     <div class="form-row">
      <span>Content Type</span>
      <!-- Added content type tab bar -->
      <div class="filter-tabs" id="contentTypeTabs">
        <button type="button" class="tab active" data-value="text/markdown">Markdown</button>
        <button type="button" class="tab" data-value="text/plain">Plain</button>
        <button type="button" class="tab" data-value="image/png;base64">PNG Image</button>
        <button type="button" class="tab" data-value="image/jpeg;base64">JPEG Image</button>
      </div>
      <input type="hidden" name="contentType" id="contentType" value="text/markdown"> <!-- Hidden field -->
    </div>

    <label class="form-row">
      <span>Content</span>
      <textarea name="content" rows="10">{{ entry.content }}</textarea>
    </label>

    <label class="form-row" style="align-items:center; gap:8px;">
      <input type="checkbox" name="as_image" id="as_image">
      <span>Upload a new image to replace this entry</span>
    </label>

  
    <label class="form-row">
      <span>Image</span>
      <input type="file" name="image" accept="image/*">
    </label>

    <div class="form-actions">
      <button type="submit" class="btn">Save</button>
      <a class="btn ghost" href="{% url 'author-all-entries' author_id=author_id %}">Cancel</a>
    </div>
  </form>


</div>
{% endblock %}
