{% extends "base.html" %}
{% block title %}Edit Entry{% endblock %}

{% block content %}
<div class="page-form">
  <h1>Edit Entry</h1>

  <!-- one form for both text posts and image posts -->
  <form method="post" enctype="multipart/form-data" class="form">
    {% csrf_token %}

    <label class="form-row">
      <span>Title</span>
      <input name="title" value="{{ entry.title }}" required>
    </label>

    <label class="form-row">
      <span>Visibility</span>
      <select name="visibility">
        <option value="PUBLIC"   {% if entry.visibility == "PUBLIC" %}selected{% endif %}>PUBLIC</option>
        <option value="UNLISTED" {% if entry.visibility == "UNLISTED" %}selected{% endif %}>UNLISTED</option>
        <option value="FRIENDS"  {% if entry.visibility == "FRIENDS" %}selected{% endif %}>FRIENDS</option>
      </select>
    </label>

    {% if entry.is_image %}
      <!-- image mode:      show preview, allow optional replace, do NOT show base64 -->
      <div class="form-row">
        <span>Current Image</span>
        <div style="display:flex; flex-direction:column; gap:0.5rem;">
          <img
            src="{% url 'entry-image' author_id=author_id entry_id=entry.id %}"
            alt="{{ entry.title|default:'image' }}"
            style="max-width:240px; height:auto; border-radius:8px; border:1px solid #ccc;"
          >
          <small style="color:#666;">This post is currently an image.</small>
        </div>
      </div>

      <label class="form-row">
        <span>Replace Image</span>
        <input type="file" name="image" accept="image/*">
      </label>

      <!-- tell backend to keep treating this as an image post -->
      <input type="checkbox" name="as_image" checked style="display:none;">

    {% else %}
      <!-- text mode:   edit body + choose contentType -->
      <label class="form-row">
        <span>Content Type</span>
        <select name="contentType">
          <option value="text/plain"
            {% if contentType == "text/plain" or entry.content_type == "text/plain" %}selected{% endif %}>
            text/plain
          </option>
          <option value="text/markdown"
            {% if contentType == "text/markdown" or entry.content_type == "text/markdown" %}selected{% endif %}>
            text/markdown
          </option>
        </select>
      </label>

      <label class="form-row">
        <span>Content</span>
        <textarea name="content" rows="10">{{ entry.content }}</textarea>
      </label>
    {% endif %}

    <div class="form-actions">
      <button type="submit" class="btn">Save</button>
      <a class="btn ghost" href="{% url 'author-all-entries' author_id=author_id %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
