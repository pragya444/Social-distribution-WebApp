                  type: string
                  example: "Sunset"
                content:
                  type: string
                  example: "Nice view"
                contentType:
                  type: string
                  example: "text/markdown"
                visibility:
                  type: string
                  example: "PUBLIC"
                as_image:
                  type: string
                  example: "on"
                image:
                  type: string
                  format: binary
      security:
        - cookieAuth: []
      responses:
        '302':
          description: Redirect to author's stream on success
