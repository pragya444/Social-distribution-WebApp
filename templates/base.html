              {% else %}

    <style>
      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: 100;
        justify-content: center;
        align-items: center;
      }
      .modal {
        width: min(640px, 92vw);
        max-height: 80vh;
        overflow: auto;
        background: #fff;
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }
      .modal header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .modal .close {
        background: none;
        border: 0;
        font-size: 20px;
        cursor: pointer;
      }
      .comments-list p {
        margin: 10px 10;
      }
      .comments-list {
        text-align: left;
      }
      .comment-form {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .comment-form input {
        flex: 1;
        padding: 8px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
      }
      .comment-form button {
        padding: 8px 12px;
        border: 0;
        border-radius: 8px;
        background: #ffa500;
        color: #fff;
        cursor: pointer;
      }
    </style>

    <div
      id="commentModal"
      class="modal-overlay"
      role="dialog"
      aria-modal="true"
      aria-label="Comments"
    >
      <div class="modal">
        <header>
          <h3>Comments</h3>
          <button type="button" class="close" id="commentModalClose">×</button>
        </header>

        <div
          id="commentModalList"
          class="comments-list"
          aria-live="polite"
        ></div>

        <form id="commentModalForm" class="comment-form">
          {% csrf_token %}
          <input
            name="comment"
            placeholder="Write a comment..."
            autocomplete="off"
          />
          <button type="submit">Post</button>
        </form>
      </div>
    </div>

    <script src="{% static 'js/comments_likes.js' %}"></script>
    <script>
      window.__getCookie = function (name) {
        const m = document.cookie.match(
          new RegExp("(^|; )" + name + "=([^;]*)")
        );
        return m ? decodeURIComponent(m[2]) : null;
      };

      window.__j = async function (url, opts = {}) {
        const headers = {
          "Content-Type": "application/json",
          ...(opts.headers || {}),
        };
        const csrftoken = window.__getCookie("csrftoken");
        if (csrftoken) headers["X-CSRFToken"] = csrftoken;
        const r = await fetch(url, {
          credentials: "same-origin",
          headers,
          ...opts,
        });
        let data = {};
        try {
          data = await r.json();
        } catch (e) {}
        return { ok: r.ok, status: r.status, data };
      };
    </script>

    <script>
      // ---- Developed with assistance from ChatGPT (GPT-5), October 2025 ----

      (function () {
        const modal = document.getElementById("commentModal");
        const list = document.getElementById("commentModalList");
        const form = document.getElementById("commentModalForm");
        const closeBtn = document.getElementById("commentModalClose");

        let activeUrl = null;
        let activeCountEl = null;

        function showModal() {
          modal.style.display = "flex";
        }
        function hideModal() {
          modal.style.display = "none";
          list.innerHTML = "";
          form.reset();
        }

        const esc = (s) =>
          String(s ?? "").replace(
            /[&<>]/g,
            (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])
          );
        async function likeFetchWithFallback(url, opts) {
          // 1) try as-is
          let r = await window.__j(url, opts);
          if (r.status !== 404) return r;

          // 2) if 404, retry toggling trailing slash
          const hasSlash = url.endsWith("/");
          const alt = hasSlash ? url.slice(0, -1) : url + "/";
          return window.__j(alt, opts);
        }
        async function loadComments(url) {
          list.innerHTML = '<p class="muted">Loading…</p>';

          const r = await window.__j(url);
          if (!r.ok) {
            list.innerHTML = '<p class="muted">Failed to load comments.</p>';
            console.error("Comments GET failed", r.status, r.data);
            return;
          }

          // normalize response
          let items = [];
          const d = r.data;
          if (Array.isArray(d)) items = d;
          else items = d.src || d.items || d.comments || d.results || [];
          const m = String(url).match(
            /authors\/([^/]+)\/entries\/([^/]+)\/comments/
          );
          const entryAuthorId = m?.[1];
          const entryId = m?.[2];

          if (!items.length) {
            list.innerHTML = '<p class="muted">No comments yet.</p>';
            return;
          }

          const esc = (s) =>
            String(s ?? "").replace(
              /[&<>]/g,
              (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])
            );
          list.innerHTML = items
            .map((c) => {
              const display =
                c.author?.displayName ??
                c.author?.username ??
                c.author?.name ??
                "Anonymous";
              let commentId = c.id || c.comment_id || c.uuid || "";

              // If c.id is a full URL, grab the tail after "/comments/"
              const mId = String(commentId).match(/\/comments\/([^/]+)\/?$/);
              if (mId) commentId = mId[1];

              const likeUrl = `/api/authors/${entryAuthorId}/entries/${entryId}/comments/${commentId}/likes/`;
              return `
              <div class="cmt-row" data-like-url="${likeUrl}">
                <div class="cmt-text"><b>${esc(display)}</b>: ${esc(
                c.comment ?? c.text ?? ""
              )}</div>
                <div class="cmt-actions">
                  <svg class="icon small-heart" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                      fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M21 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35l-.45-.41C6.4 15.36 3 12.28 3 8.5A4.5 4.5 0 0 1 7.5 4c1.74 0 3.41.81 4.5 2.09A6 6 0 0 1 16.5 4 4.5 4.5 0 0 1 21 8.5z"/>
                  </svg>
                  <span data-comment-like-count>0</span>
                </div>
              </div>
            `;
            })
            .join("");

          // wire up hearts
          const rows = list.querySelectorAll(".cmt-row");
          for (const row of rows) {
            const likeUrl = row.getAttribute("data-like-url");
            const heart = row.querySelector(".small-heart");
            const cnt = row.querySelector("[data-comment-like-count]");

            // initial GET to populate count + liked state, initialize like button
            const g = await likeFetchWithFallback(likeUrl, {});
            if (g.ok && typeof g.data?.count === "number") {
              cnt.textContent = g.data.count;
              if (g.data.liked) {
                heart.classList.add("liked"); //  red initially
              } else {
                heart.classList.remove("liked");
              }
            }

            const rows = list.querySelectorAll(".cmt-row");
            for (const row of rows) {
              const likeUrl = row.getAttribute("data-like-url");
              const heart = row.querySelector(".small-heart");
              const cnt = row.querySelector("[data-comment-like-count]");

              // initial GET to populate count and liked state
              const g = await likeFetchWithFallback(likeUrl, {});
              if (g.ok) {
                cnt.textContent = g.data.count ?? 0;
                heart.classList.toggle("liked", !!g.data.liked);
                heart.setAttribute(
                  "aria-pressed",
                  g.data.liked ? "true" : "false"
                );
              }

              heart.addEventListener("click", async (e) => {
                e.preventDefault();
                const liked = heart.classList.contains("liked");
                // POST = like, DELETE = unlike
                const method = liked ? "DELETE" : "POST";
                const r = await likeFetchWithFallback(likeUrl, { method });
                //Update visual + state based on response
                if (r.ok) {
                  // Flip the red heart on/off
                  heart.classList.toggle("liked", r.data.liked === true);
                  //store state for screen readers
                  heart.setAttribute(
                    "aria-pressed",
                    r.data.liked ? "true" : "false"
                  );
                  //Update like count
                  if (typeof r.data.count === "number")
                    cnt.textContent = r.data.count;
                } else if (r.status === 403) {
                  alert("Please log in to like.");
                } else {
                  alert("Error toggling like.");
                  console.error("Toggle like failed", likeUrl, r);
                }
              });
            }
          }
        }

        // refresh counts
        async function refreshCount(url, el) {
          const r = await window.__j(url);
          if (r.ok && el) {
            el.textContent =
              typeof r.data.count === "number"
                ? r.data.count
                : r.data.src?.length ?? 0;
          }
        }

        // toggles like/unlike behavior on heart click
        document.addEventListener("click", async (e) => {
          const btn = e.target.closest(".comment-trigger");
          if (!btn) return;
          activeUrl = btn.getAttribute("data-comments-url");
          activeCountEl = btn.querySelector("[data-comment-count]");
          showModal();
          await loadComments(activeUrl);
          await refreshCount(activeUrl, activeCountEl);
        });

        // Post a comment
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const text = form.comment.value.trim();
          if (!text || !activeUrl) return;
          const r = await window.__j(activeUrl, {
            method: "POST",
            body: JSON.stringify({
              type: "comment",
              comment: text,
              contentType: "text/plain",
            }),
          });

          if (r.ok) {
            form.reset();
            await loadComments(activeUrl);
            await refreshCount(activeUrl, activeCountEl); // instant count update
            // optional optimistic bump if you want immediate feedback:
            // window.__bumpCommentCountForUrl && window.__bumpCommentCountForUrl(activeUrl);
          } else if (r.status === 403) {
            alert("Please log in to comment.");
            console.warn("403 on comment POST — likely auth/CSRF", r.data);
          } else {
            alert("Failed to post comment.");
            console.error("Comment POST failed", r.status, r.data);
          }
        });

        // Close modal
        closeBtn.addEventListener("click", hideModal);
        modal.addEventListener("click", (e) => {
          if (e.target === modal) hideModal();
        });
      })();
    </script>

    <script>
      // ---- Developed with assistance from ChatGPT (GPT-5), October 2025 ----

      (function () {
        // ---- helpers ----
        function getCookie(name) {
          const m = document.cookie.match(
            new RegExp("(^|; )" + name + "=([^;]*)")
          );
          return m ? decodeURIComponent(m[2]) : null;
        }
        async function j(url, opts = {}) {
          const headers = { "Content-Type": "application/json" };
          // If your likes/comments views are CSRF-protected, send the token:
          const csrftoken = getCookie("csrftoken");
          if (csrftoken) headers["X-CSRFToken"] = csrftoken;

          const r = await fetch(url, {
            credentials: "same-origin",
            headers,
            ...opts,
          });
          let data = {};
          try {
            data = await r.json();
          } catch (e) {}
          return { ok: r.ok, status: r.status, data };
        }

        // ---- Likes: init + toggle ----
        async function initLike(btn) {
          const likesUrl = btn.dataset.likesUrl;
          const inboxUrl = btn.dataset.inboxUrl;
          const objectFQID = btn.dataset.objectFqid;
          const remoteInboxUrl = btn.dataset.remoteInboxUrl;

          if (!inboxUrl || !objectFQID) {
            console.warn(
              "Skipping like button, missing inboxUrl or objectFQID",
              btn
            );
            return;
          }

          const cnt = btn.querySelector("[data-like-count]");

          btn.addEventListener("click", async (event) => {
            const isAuthenticated =
              "{{ user.is_authenticated|yesno:'true,false' }}" === "true";
            if (!isAuthenticated) {
              alert("Please log in to like this post.");
              return;
            }
            event.preventDefault();
            const payload = {
              type: "like",
              object: objectFQID,
            };
            console.log("Sending like payload to inbox:", payload);
            console.log("Inbox URL:", inboxUrl);
            const r = await j(inboxUrl, {
              method: "POST",
              body: JSON.stringify(payload),
            });

            if (r.ok) {
              console.log("Like toggled successfully", r.data);
              btn.classList.toggle("liked", r.data.liked === true);
              btn.setAttribute("aria-pressed", r.data.liked ? "true" : "false");
              if (cnt && typeof r.data.count === "number")
                cnt.textContent = r.data.count;
            } else {
              console.error("Failed to send like to inbox", r.data);
              return;
            }

            // 2) If this entry is remote, also notify the remote node
            if (remoteInboxUrl) {
              console.log("Also sending like to remote inbox:", remoteInboxUrl);
              try {
                await j(remoteInboxUrl, {
                  method: "POST",
                  body: JSON.stringify(payload),
                });
              } catch (e) {
                console.error("Failed to send like to remote inbox", e);
                // you can choose to ignore this failure for UI purposes
              }
            }
          });
        }

        // ---- Developed with assistance from ChatGPT (GPT-5), October 2025 ----
        // ---- Comments: init count + poll periodically ----

        async function initCommentCount(btn) {
          const url = btn.dataset.commentsUrl;
          const el = btn.querySelector("[data-comment-count]");
          if (!el) return;

          async function refresh() {
            const r = await j(url);
            if (r.ok) {
              const c =
                typeof r.data.count === "number"
                  ? r.data.count
                  : r.data.src?.length ?? 0;
              el.textContent = c;
            }
          }
          await refresh(); // initial
          // setInterval(refresh, 2000);       // auto-update every 2s
        }
        // ---- Developed with assistance from ChatGPT (GPT-5), October 2025 ----
        // ---- Wire up everything on DOM ready ----
        document.addEventListener("DOMContentLoaded", () => {
          document
            .querySelectorAll(".like-toggle[data-likes-url]")
            .forEach(initLike);
          document
            .querySelectorAll(".comment-trigger[data-comments-url]")
            .forEach(initCommentCount);
        });

        // ---- Developed with assistance from ChatGPT (GPT-5), October 2025 ----

        // When your comment modal POSTs successfully, call this:
        window.__bumpCommentCountForUrl = function (commentsUrl) {
          const btn = document.querySelector(
            `.comment-trigger[data-comments-url="${CSS.escape(commentsUrl)}"]`
          );
          const el = btn?.querySelector("[data-comment-count]");
          if (!el) return;
          const n = parseInt(el.textContent || "0", 10);
          el.textContent = isNaN(n) ? 1 : n + 1;
        };
      })();
    </script>
  </body>
</html>
